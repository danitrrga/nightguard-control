<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Nightguard mark — "Ceramic Night": a porcelain crescent guarded by a single cobalt
       arc. Clean, geometric, intentional. Cobalt = the guard; bone = the night it keeps. -->
  <defs>
    <radialGradient id="atmo" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#4487d6" stop-opacity="0.20"/>
      <stop offset="65%" stop-color="#4487d6" stop-opacity="0"/>
    </radialGradient>
    <!-- crescent = full disc minus an offset disc -->
    <mask id="crescent">
      <rect width="512" height="512" fill="black"/>
      <circle cx="256" cy="256" r="96" fill="white"/>
      <circle cx="296" cy="224" r="84" fill="black"/>
    </mask>
  </defs>

  <!-- canvas -->
  <rect width="512" height="512" rx="116" fill="#0f1318"/>
  <rect width="512" height="512" rx="116" fill="url(#atmo)"/>

  <!-- guard arc: a single cobalt sweep, open at the lower-right, that "wraps" the moon -->
  <circle cx="256" cy="256" r="168" fill="none" stroke="#4487d6" stroke-width="16"
          stroke-linecap="round" stroke-dasharray="800 1056" transform="rotate(128 256 256)"/>

  <!-- porcelain crescent -->
  <rect width="512" height="512" fill="#f4f0e6" mask="url(#crescent)"/>
</svg>
