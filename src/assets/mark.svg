<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- Nightguard titlebar mark — cobalt crescent + guard arc, monochrome for 18px clarity. -->
  <defs>
    <mask id="m">
      <rect width="24" height="24" fill="black"/>
      <circle cx="11" cy="12" r="6.4" fill="white"/>
      <circle cx="14" cy="9.6" r="5.4" fill="black"/>
    </mask>
  </defs>
  <circle cx="12" cy="12" r="10.2" fill="none" stroke="#4487d6" stroke-width="1.7"
          stroke-linecap="round" stroke-dasharray="34 30" transform="rotate(128 12 12)"/>
  <rect width="24" height="24" fill="#4487d6" mask="url(#m)"/>
</svg>
