<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nightguard Control</title>
    <link rel="icon" type="image/svg+xml" href="/assets/logo.svg" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div id="titlebar">
      <div class="tb-drag" data-tauri-drag-region>
        <span class="tb-brand">
          <img src="/assets/mark.svg" width="18" height="18" aria-hidden="true" draggable="false" />
          <span class="wordmark">Nightguard</span>
        </span>
        <span id="status-pill" class="pill">—</span>
      </div>
      <div class="tb-controls">
        <button type="button" id="btn-min" class="tb-btn" aria-label="Minimize" title="Minimize">
          <svg viewBox="0 0 10 1" aria-hidden="true"><rect width="10" height="1" fill="currentColor"/></svg>
        </button>
        <button type="button" id="btn-max" class="tb-btn" aria-label="Maximize" title="Maximize">
          <svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1" aria-hidden="true"><rect x=".5" y=".5" width="9" height="9"/></svg>
        </button>
        <button type="button" id="btn-close" class="tb-btn tb-close" aria-label="Close" title="Close">
          <svg viewBox="0 0 10 10" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" aria-hidden="true"><path d="M1 1l8 8M9 1L1 9"/></svg>
        </button>
      </div>
    </div>
    <div id="shell">
      <nav id="rail" aria-label="Primary">
        <button type="button" class="rail-item" id="rail-status" aria-label="Status" aria-current="page" title="Status">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="8.5" />
            <path d="M12 7.5V12l3 2" />
          </svg>
        </button>

        <button type="button" class="rail-item" id="rail-edit" aria-label="Edit" title="Edit">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 20h9" />
            <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z" />
          </svg>
        </button>

        <span class="rail-spacer"></span>
      </nav>

      <main id="main">
        <!-- Status view: ring hero → 2-up cards → health footer. -->
        <section id="status-view" aria-live="polite">
          <div class="hero">
            <div class="ring-wrap">
              <svg class="ring" viewBox="0 0 240 240" aria-hidden="true">
                <circle class="ring-track" cx="120" cy="120" r="108" />
                <circle id="ring-arc" cx="120" cy="120" r="108" />
                <circle id="ring-moon" cx="120" cy="12" r="6" />
              </svg>
              <div class="ring-center">
                <p id="status-word"></p>
                <div id="countdown" class="type-display" aria-label="Time remaining">--:--:--</div>
                <p id="status-caption" class="type-label"></p>
              </div>
            </div>
          </div>

          <div class="card-row">
            <section class="card" aria-label="Weekly loosen tokens">
              <p class="eyebrow">Weekly tokens</p>
              <div id="token-meter"></div>
              <p id="token-caption" class="token-caption type-label"></p>
            </section>

            <section class="card" aria-label="Daily grace">
              <p class="eyebrow">Grace</p>
              <p id="grace-caption" class="grace-caption type-label"></p>
              <button type="button" id="grace-btn" class="action-btn" disabled>+8 minutes</button>
            </section>
          </div>

          <footer class="foot">
            <span id="guard-health" class="chip">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M12 3 5 6v5c0 4.4 3 7.6 7 9 4-1.4 7-4.6 7-9V6l-7-3Z" />
                <path d="m9.5 12 1.8 1.8L15 10" />
              </svg>
              <span id="guard-health-text">Guard active</span>
            </span>
          </footer>
        </section>

        <!-- Edit view: one ceramic panel (sole sanctioned editor). -->
        <section id="edit-view" aria-live="polite" hidden>
          <div class="edit-panel">
            <div class="edit-head">
              <div class="edit-head-top">
                <p class="eyebrow">Sole sanctioned editor</p>
                <span id="edit-budget" class="budget-chip" title="Weekly loosen tokens remaining">
                  <span class="budget-dots" id="edit-budget-dots" aria-hidden="true"></span>
                  <span id="edit-budget-text">—</span>
                </span>
              </div>
              <h2 class="type-heading edit-title">Curfew schedule</h2>
              <p class="edit-sub type-label">Edits here are signed. Hand-edits to the config revert automatically.</p>
            </div>

            <div class="edit-row">
              <div class="edit-row-main">
                <label class="row-label" for="field-enabled">Curfew enabled</label>
                <p class="row-hint type-label">When off, no lock is enforced.</p>
              </div>
              <label class="switch">
                <input type="checkbox" id="field-enabled" class="switch-input" />
                <span class="switch-track" aria-hidden="true"><span class="switch-thumb"></span></span>
              </label>
            </div>
            <span class="field-feedback type-label" id="fb-curfew.enabled"></span>

            <hr class="edit-rule" />

            <div class="time-range">
              <div class="time-field">
                <label class="row-label" for="field-start">Locks at</label>
                <input type="time" id="field-start" class="field-input" />
                <span class="field-feedback type-label" id="fb-curfew.start"></span>
              </div>
              <span class="time-arrow" aria-hidden="true">&rarr;</span>
              <div class="time-field">
                <label class="row-label" for="field-end">Opens at</label>
                <input type="time" id="field-end" class="field-input" />
                <span class="field-feedback type-label" id="fb-curfew.end"></span>
              </div>
            </div>

            <div class="edit-foot">
              <p class="edit-reason type-label" id="edit-reason"></p>
              <button type="button" id="commit-btn" class="action-btn">Commit changes</button>
            </div>
          </div>
        </section>
      </main>
    </div>

    <script type="module" src="/main.ts"></script>
  </body>
</html>
