[project]
name = "ngtui"
version = "0.1.0"
description = "Nightguard Control — omarchy Textual TUI thin-client over the Python trust stack"
requires-python = ">=3.11"
dependencies = ["textual==8.2.7"]

[project.scripts]
ngtui = "ngtui.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ngtui"]
