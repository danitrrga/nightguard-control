[package]
name = "nightguard-control"
version = "0.1.0"
edition = "2021"

# v2 desktop+mobile-parity layout: thin main.rs + run() in lib.rs.
# The _lib suffix keeps the lib name distinct from the bin (tauri 2.11.2 scaffold convention).
[lib]
name = "nightguard_control_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Production builds MUST enable this so Tauri embeds the frontend (custom asset protocol)
# instead of loading the dev server (devUrl = http://localhost:1420). `tauri build` sets it
# automatically; a manual `cargo build --release` must pass `--features custom-protocol` or the
# app boots in dev mode and shows ERR_CONNECTION_REFUSED for localhost. (tauri-macros gates this:
# `dev: cfg!(not(feature = "custom-protocol"))`.) DO NOT REMOVE.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11.2", features = ["tray-icon"] }
tauri-plugin-fs = { version = "2.5.1", features = ["watch"] }
trust-kernel    = { path = "../crates/trust-kernel" }
mutation-engine = { path = "../crates/mutation-engine" }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror  = "1"
chrono     = "0.4"
chrono-tz  = "0.10"
hex        = "0.4.3"
tauri-plugin-single-instance = "2.4.2"
