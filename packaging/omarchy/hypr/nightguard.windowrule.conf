# >>> nightguard (managed) — do not edit inside markers >>>
# Float/center/size the ngtui window. Keyed on the stable Wayland app_id
# (org.omarchy.ngtui, set via xdg-terminal-exec --app-id), NEVER the title —
# a title match is spoofable and content-dependent (SC-1). Explicit 3-line form
# (order-independent, self-contained) rather than `tag +floating-window`.
windowrule = float on,     match:class ^(org\.omarchy\.ngtui)$
windowrule = center on,    match:class ^(org\.omarchy\.ngtui)$
windowrule = size 875 600, match:class ^(org\.omarchy\.ngtui)$

# The workshop — the app/site picker the desktop panel opens. It is a
# quickshell FloatingWindow, so its class is `org.quickshell`, which every other
# window the shell owns also carries: the bar, the OSD, the lock surface. The
# class ALONE would float the bar, so the title is part of the match here.
#
# That is a deliberate departure from the SC-1 rule three lines up, and the
# reason the rule differs is that the risk does. SC-1 is about a window
# CLAIMING to be the sanctioned editor; nothing here is authorised by matching,
# and the worst a spoofed title achieves is floating a window that was going to
# be on screen anyway. The class half still has to hold, so only a quickshell
# window can match at all.
windowrule = float on,     match:class ^(org\.quickshell)$ match:title ^(Nightguard — el taller)$
windowrule = center on,    match:class ^(org\.quickshell)$ match:title ^(Nightguard — el taller)$
windowrule = size 900 700, match:class ^(org\.quickshell)$ match:title ^(Nightguard — el taller)$
# <<< nightguard (managed) <<<
