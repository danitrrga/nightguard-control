<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Nightguard Control brand mark: a crescent moon on a rounded-square app tile.
       Moonlit-Indigo palette (CLAUDE.md): surface #161a24, border #242a38, accent #7aa2ff.
       Authored to read at 16px monochrome-first; the tile plus crescent silhouette carries
       meaning even without colour. Single source of truth: the installer rasterizes the
       hicolor PNG sizes from this SVG at install time. -->
  <!-- rounded-square app tile -->
  <rect x="16" y="16" width="480" height="480" rx="108" ry="108" fill="#161a24"/>
  <rect x="20" y="20" width="472" height="472" rx="104" ry="104"
        fill="none" stroke="#242a38" stroke-width="8"/>
  <!-- crescent: moon circle minus an offset smaller circle (mask cut) -->
  <defs>
    <mask id="crescent">
      <rect width="512" height="512" fill="black"/>
      <circle cx="240" cy="256" r="156" fill="white"/>
      <circle cx="326" cy="216" r="132" fill="black"/>
    </mask>
  </defs>
  <circle cx="240" cy="256" r="156" fill="#7aa2ff" mask="url(#crescent)"/>
</svg>
